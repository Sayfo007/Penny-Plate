#v{max-width:680px;margin:0 auto;padding:18px 16px 110px;animation:in .25s}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:0;border-radius:99px;padding:8px 14px;background:var(--card);color:var(--ink);font:500 14px inherit;font-family:inherit;box-shadow:var(--sh);cursor:pointer}
.chip.on{background:var(--brand);color:#fff}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);cursor:pointer;position:relative}
.rc .big{font-size:38px}.rc button{position:absolute;right:8px;top:8px;background:none;border:0;font-size:20px;cursor:pointer}

recipes(){const hid=M.filter(m=>(!m.c||m.c===S.c)&&!ok(m,0)).length;return`<div class="top">${LOGO}Recipes</div><input id="q" placeholder="Search recipes…" value="${esc(S.q)}"><div class="chips">${["All","Local","Veggie","Quick","Cheapest","Saved"].map(f=>`<button class="chip${S.f===f?" on":""}" data-a="flt" data-f="${f}">${f}</button>`).join("")}</div>${hid?`<p class="mute">${hid} recipes hidden by your diet, dislikes or allergies.</p>`:""}<div id="rl">${cards()}</div>`},

if(!n)return`<div class="top">${LOGO}Basket</div><div class="empty"><i>🛒</i>Your basket appears once you plan your week.<br><br><button class="btn" data-a="go" data-h="plan">Make a plan</button></div>`;

const TABS=[["home","🏠","Home"],["plan","🗓️","Plan"],["recipes","📖","Recipes"],["list","🛒","Basket"],["taste","🍴","Tastes"],["about","⚙️","More"]];
function route(keep){let h=(location.hash||"#home").slice(1);if(!P[h])h="home";$("v").innerHTML=P[h]();$("v").style.animation="none";void $("v").offsetWidth;$("v").style.animation="";

$("ob").style.display=S.done?"none":"block";if(!S.done)$("ob").innerHTML=obHTML()}

const toggle=(a,v)=>{const x=a.indexOf(v);x>-1?a.splice(x,1):a.push(v)};
document.addEventListener("click",async e=>{const el=e.target;if(el.id==="sh"){$("sh").classList.remove("o");return}
const t=el.closest("[data-a]");if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
if(a==="fav"){e.stopPropagation();toggle(S.fav,i);save();if(t.dataset.s)sheet(i);if($("rl"))$("rl").innerHTML=cards();return}
if(a==="open")sheet(i);else if(a==="close")$("sh").classList.remove("o");
else if(a==="go"){location.hash=t.dataset.h}
else if(a==="gen"){gen();route(1)}
else if(a==="gen2"){gen();location.hash="#plan"}
else if(a==="swap"){e.stopPropagation();const p=pool(0).filter(k=>!S.plan.includes(k)&&!M[k].x);if(p.length){S.plan[+t.dataset.d]=p[Math.floor(Math.random()*p.length)];S.checked={};save()}route(1)}
else if(a==="tg"){toggle(S[t.dataset.k],t.dataset.v);save();rerender()}
else if(a==="diet"){S.diet=t.dataset.v;save();rerender()}
else if(a==="next"){if(S.step<3)S.step++;else{S.done=1;gen();location.hash="#plan"}save();route()}
else if(a==="back"){S.step--;save();route()}
else if(a==="flt"){S.f=t.dataset.f;save();route(1)}
else if(a==="clr"){S.checked={};save();route(1)}
else if(a==="add")addFr();
else if(a==="rm"){S.fr.splice(i,1);save();route(1)}
else if(a==="loc")detect();
else if(a==="clrcu"){S.cu=[];save();rerender()}
else if(a==="redo"){S.done=0;S.step=0;save();route()}
else if(a==="copy"){const L=items(),txt="PennyPlate basket · "+stv().n+" ("+cc().n+")\n"+Object.keys(L).sort().map(k=>"☐ "+k+" – "+fmt(L[k])).join("\n")+"\nTotal ≈ "+fmt(total());try{await navigator.clipboard.writeText(txt);t.textContent="Copied ✓"}catch(_){t.textContent="Copy failed"}}
else if(a==="reset"&&confirm("Reset all your PennyPlate data?")){try{localStorage.removeItem("pp3")}catch(_){}location.reload()}});
function addFr(){const v=($("fi").value||"").toLowerCase().trim();if(v&&!S.fr.includes(v)){S.fr.push(v);save();route(1);$("fi").focus()}}
document.addEventListener("keydown",e=>{if(e.target.id==="fi"&&(e.key==="Enter"||e.key===",")){e.preventDefault();addFr()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("rl").innerHTML=cards();save()}});
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.s;
if(t.dataset.k){S.checked[t.dataset.k]=t.checked;save();t.closest(".chk").classList.toggle("d",t.checked);const b=[...document.querySelectorAll(".chk input")],c=b.filter(x=>x.checked).length,h=document.querySelector("#v .card:nth-of-type(2) h3");if(h)h.textContent=c+" of "+b.length+" items · "+fmt(total());const m=document.querySelector("#v .meter i");if(m)m.style.width=c/b.length*100+"%";return}
if(!k)return;
if(k==="c"){S.c=t.value;S.st=0;S.bud=Math.round(40*cc().r*cc().ix);S.plan=[];S.checked={};S.cu=S.cu.filter(x=>x!=="Local"||0)}
else if(k==="lang"){S.lang=t.value;applyLang()}else if(k==="st")S.st=+t.value;else if(k==="theme"){S.theme=t.value;th()}else S[k]=Math.max(1,+t.value||1);
save();rerender()});

/* ===== external links (maps, store sites) ===== */
function openExt(u){try{if(window.__ppBrowser)return window.__ppBrowser.open({url:u});const P=window.Capacitor&&Capacitor.Plugins;if(P&&P.Browser)return P.Browser.open({url:u});if(P&&P.App&&P.App.openUrl)return P.App.openUrl({url:u})}catch(e){}try{if(window.open(u,"_blank"))return}catch(e){}location.href=u}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[target=_blank]");if(!a)return;e.preventDefault();openExt(a.href)},true);

/* ===== live recipes (TheMealDB) ===== */
const EMO={Beef:"🥩",Chicken:"🍗",Dessert:"🍰",Lamb:"🍖",Miscellaneous:"🍽️",Pasta:"🍝",Pork:"🥓",Seafood:"🐟",Side:"🥗",Starter:"🥟",Vegan:"🥦",Vegetarian:"🥕",Breakfast:"🍳",Goat:"🍖"};
const AS={Chinese:"Asian",Japanese:"Asian",Thai:"Asian",Vietnamese:"Asian",Filipino:"Asian",Malaysian:"Asian",Egyptian:"Middle Eastern",Moroccan:"Middle Eastern",Tunisian:"Middle Eastern",Turkish:"Middle Eastern",Greek:"Mediterranean",Spanish:"Mediterranean",Portuguese:"Mediterranean"};
const AK={American:"US",British:"GB",Canadian:"CA",Chinese:"CN",Croatian:"HR",Dutch:"NL",Egyptian:"EG",Filipino:"PH",French:"FR",Greek:"GR",Indian:"IN",Irish:"IE",Italian:"IT",Jamaican:"JM",Japanese:"JP",Kenyan:"KE",Malaysian:"MY",Mexican:"MX",Moroccan:"MA",Polish:"PL",Portuguese:"PT",Russian:"RU",Spanish:"ES",Thai:"TH",Tunisian:"TN",Turkish:"TR",Ukrainian:"UA",Uruguayan:"UY",Vietnamese:"VN"};
const MEAT=/chicken|beef|lamb|pork|bacon|ham\b|sausage|mince|steak|turkey|duck|chorizo|goat|veal|gammon|prosciutto|salami|fish|salmon|tuna|cod\b|haddock|mackerel|sardine|anchov|prawn|shrimp|crab|lobster|mussel|squid|clam|oyster/i;
const PR=[[/salt|pepper|paprika|cumin|coriander|turmeric|cinnamon|oregano|thyme|basil|parsley|chilli|chili|ginger|garlic|cayenne|spice|seasoning|bay leaf|nutmeg|clove|cardamom|vinegar|stock|sauce|oil|sugar|honey|water|mustard|paste|powder/i,.1],[/chicken|beef|lamb|pork|steak|mince|turkey|duck|goat|veal|gammon|sausage|bacon|chorizo|ham\b/i,1.3],[/salmon|cod\b|haddock|tuna|prawn|shrimp|fish|crab|lobster|mussel|squid|mackerel|sardine|clam/i,1.6],[/cheese|cream|butter|yogh?urt|milk|paneer/i,.35]];
const price=n=>{for(const p of PR)if(p[0].test(n))return p[1];return .3};
function cv(x){const ig=[],seen=new Set();for(let k=1;k<=20;k++){const n=(x["strIngredient"+k]||"").trim().toLowerCase();if(!n||seen.has(n))continue;seen.add(n);ig.push({n,c:price(n),q:(x["strMeasure"+k]||"").trim()})}
const raw=(x.strInstructions||"").replace(/\r?\n+/g," ").replace(/\b(STEP|Step)\s*\d+\s*/g,"").replace(/\s+/g," ").trim();if(ig.length<2||!raw)return null;
let t=raw;if(t.length>1100){t=t.slice(0,1100);t=t.slice(0,Math.max(t.lastIndexOf(". ")+1,600))}
const a=x.strArea||"",cat=x.strCategory||"";
return{id:x.idMeal,e:EMO[cat]||"🍽️",n:(x.strMeal||"").trim(),t:Math.min(90,Math.max(15,Math.round(raw.length/225)*5)),i:ig,s:esc(t),o:AS[a]||a||"Other",c:"",k:AK[a]||"",x:/Dessert|Starter|Side/.test(cat)?1:0,v:!ig.some(g=>MEAT.test(g.n)),img:x.strMealThumb||""}}
let LV=[];try{LV=JSON.parse(localStorage.getItem("pp_live")||"[]")}catch(e){}
function addLive(a){const have=new Set(M.filter(m=>m.id).map(m=>m.id));let n=0;a.forEach(m=>{if(m&&!have.has(m.id)){M.push(m);have.add(m.id);n++}});KIT=mkKIT();return n}
addLive(LV);
async function fetchLive(){if(navigator.onLine===false)return;let ts=0;try{ts=+localStorage.getItem("pp_live_t")||0}catch(e){}if(LV.length>150&&Date.now()-ts<6048e5)return;
const L="abcdefghijklmnopqrstuvwxyz".split(""),got=[];await Promise.all([0,1,2,3].map(async w=>{for(let k=w;k<L.length;k+=4){try{const j=await jget("https://www.themealdb.com/api/json/v1/1/search.php?f="+L[k],12000);(j.meals||[]).forEach(m=>{const c=cv(m);if(c)got.push(c)})}catch(e){}}}));
const old=new Set(LV.map(m=>m.id)),fresh=got.filter(m=>!old.has(m.id));if(!got.length)return;LV=LV.concat(fresh);try{localStorage.setItem("pp_live",JSON.stringify(LV));localStorage.setItem("pp_live_t",Date.now())}catch(e){}
if(addLive(fresh)&&!/INPUT|SELECT/.test(document.activeElement.tagName))route(1)}

/* ===== languages: starts in the phone's language ===== */
const LC="af sq am ar hy as ay az bm eu be bn bho bs bg ca ceb zh-CN zh-TW co hr cs da dv doi nl en eo et ee fil fi fr fy gl lg ka de el gn gu ht ha haw he hi hmn hu is ig ilo id ga it ja jv kn kk km rw gom ko kri ku ckb ky lo la lv ln lt lb mk mai mg ms ml mt mi mr mni-Mtei lus mn my ne no or om ps fa pl pt pa qu ro ru sm sa gd nso sr st sn sd si sk sl so es su sw sv tg ta tt te th ti ts tr tk ak uk ur ug uz vi cy xh yi yo zu".split(" ");
const RTL=/^(ar|he|fa|ur|ps|sd|ug|yi|dv|ckb)/;
function phoneLang(){for(const l of(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"])){const x=String(l).replace("_","-"),b=x.split("-")[0].toLowerCase();let c=LC.find(k=>k.toLowerCase()===x.toLowerCase());if(c)return c;if(b==="zh")return/tw|hk|mo|hant/i.test(x)?"zh-TW":"zh-CN";if(b==="nb"||b==="nn")return"no";if(b==="iw")return"he";if(b==="jw")return"jv";if(b==="tl")return"fil";c=LC.find(k=>k===b);if(c)return c}return"en"}
const lname=c=>{try{return new Intl.DisplayNames([c],{type:"language"}).of(c)||c}catch(e){return c}};
const langSel=()=>`<select data-s="lang" style="width:auto;max-width:60%">${LC.map(c=>[c,lname(c)]).sort((a,b)=>a[1].localeCompare(b[1])).map(x=>`<option value="${x[0]}"${x[0]===S.lang?" selected":""}>${x[1]}</option>`).join("")}</select>`;
const secLang=()=>`<div class="card"><label>🌐 Language</label>${langSel().replace(' style="width:auto;max-width:60%"','')}</div>`;
function applyDN(){try{const d=new Intl.DisplayNames([/^mni|^ckb|^gom|^bho|^doi|^lus|^mai/.test(S.lang)?"en":S.lang],{type:"region"});C.forEach(x=>{x.n=d.of(x.k)||x.n});C.sort((a,b)=>a.n.localeCompare(b.n))}catch(e){}}
function applyLang(){document.documentElement.lang=S.lang;document.documentElement.dir=RTL.test(S.lang)?"rtl":"ltr";applyDN();save();sched()}
let TC={};try{TC=JSON.parse(localStorage.getItem("pp_tr")||"{}")}catch(e){}
const TAPI={he:"iw",jv:"jw",fil:"tl"},tw=[],tq=new Set(),TF={};let tact=0,tt=0;
async function tx(l,s){const ch=[];let cur="";(s.length>1400?s.match(/[^.!?]+[.!?]*\s*/g)||[s]:[s]).forEach(p=>{if(cur&&(cur+p).length>1400){ch.push(cur);cur=p}else cur+=p});if(cur)ch.push(cur);const out=[];
for(const c of ch){const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl="+(TAPI[l]||l)+"&dt=t",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"q="+encodeURIComponent(c)});const j=await r.json();out.push(j[0].map(x=>x[0]).join(""))}return out.join("")}
function need(l,k){const id=l+"\u0001"+k;if(tq.has(id)||Date.now()-(TF[l]||0)<30000)return;tq.add(id);tw.push([l,k]);pump()}
function pump(){while(tact<6&&tw.length){const[l,k]=tw.shift();tact++;tx(l,k).then(r=>{(TC[l]=TC[l]||{})[k]=r}).catch(()=>{TF[l]=Date.now();tq.delete(l+"\u0001"+k)}).finally(()=>{tact--;if(!tw.length&&!tact){try{localStorage.setItem("pp_tr",JSON.stringify(TC))}catch(e){}}sched();pump()})}}
function sched(){clearTimeout(tt);tt=setTimeout(scan,250)}
function scan(){const l=S.lang||"en",w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),ns=[];let n;while(n=w.nextNode())ns.push(n);
ns.forEach(n=>{const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName))return;if(p.tagName==="OPTION"&&/^(c|st|lang)$/.test(p.parentElement.dataset.s||""))return;
const cur=n.nodeValue,src=n.__t!==undefined&&cur===n.__t?n.__o:cur,key=src.trim();if(!key||!/\p{L}/u.test(key)||/\d/.test(key)||key==="PennyPlate")return;
const r=l==="en"?key:(TC[l]||{})[key];if(l==="en"||r!==undefined){const out=src.replace(key,()=>r||key);if(out!==cur){n.__o=src;n.__t=out;n.nodeValue=out}}else need(l,key)});
document.querySelectorAll("[placeholder]").forEach(e=>{const o=e.__op||(e.__op=e.getAttribute("placeholder")),r=l==="en"?o:(TC[l]||{})[o];if(r)e.setAttribute("placeholder",r);else if(l!=="en")need(l,o)})}
if(!S.lang||!LC.includes(S.lang))S.lang=phoneLang();applyLang();
new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
addEventListener("hashchange",()=>route());route();if(!S.tried)detect();fetchLive();
</script>
